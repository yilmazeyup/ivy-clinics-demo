<script>
  // GitHub Pages answers every unknown address with the Pure Clinics app's 404.html. A Blanche address goes on to the
  // Blanche app instead, which opens that screen (?pad=…); the admin panel is a single page with its own index.html.
  (function () {
    var base = '/pure-clinics-demo/blanche/';
    var path = location.pathname;
    if (path.indexOf(base) !== 0) return;
    var rest = path.slice(base.length).replace(/\/+$/, '');
    var search = location.search ? '&' + location.search.slice(1) : '';
    location.replace(base + (rest ? '?pad=' + encodeURIComponent('/' + rest) + search : location.search) + location.hash);
  })();
</script>
