    <style>
      :root {
        --bg: #f6f1ea;
        --surface: #ffffff;
        --ink: #1e1e1c;
        --muted: #6e6259;
        --line: #e2d8cc;
        --accent: #1e1e1c;
        --soft: #efe7dc;
        --display: 'Cormorant Garamond', Georgia, serif;
        --body: 'Jost', system-ui, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
      }
      body {
        background: var(--bg);
        color: var(--ink);
        font: 400 17px/1.55 var(--body);
        -webkit-font-smoothing: antialiased;
      }
      a {
        color: inherit;
      }
      .wrap {
        max-width: 1180px;
        margin: 0 auto;
        padding: 28px max(20px, env(safe-area-inset-right, 0px)) 56px max(20px, env(safe-area-inset-left, 0px));
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }
      /* The Pure Clinics wordmark in type: PURE a little heavier than CLINICS, both widely spaced. */
      .logo {
        font: 300 17px/1 var(--body);
        letter-spacing: 0.36em;
        white-space: nowrap;
        text-decoration: none;
      }
      .logo b {
        font-weight: 500;
      }
      .lang {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 14px;
        color: var(--muted);
      }
      .lang select {
        font: 500 15px var(--body);
        color: var(--ink);
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 8px;
        height: 40px;
        padding: 0 10px;
      }
      h1 {
        margin: 56px 0 0;
        font: 300 clamp(44px, 7vw, 76px) / 1 var(--display);
        letter-spacing: -0.01em;
        text-wrap: balance;
      }
      h1 em {
        font-style: italic;
      }
      .lead {
        max-width: 640px;
        margin: 18px 0 0;
        font-size: 19px;
        color: var(--muted);
      }
      /* The way to the explainer video and the questions people ask. */
      .web-link {
        margin-top: 18px;
        display: grid;
        grid-template-columns: 180px minmax(0, 1fr);
        align-items: center;
        gap: 22px;
        max-width: 760px;
        padding: 10px 22px 10px 10px;
        border-radius: 16px;
        border: 1px solid var(--line);
        background: var(--surface);
        text-decoration: none;
        transition: border-color 0.3s;
      }
      .web-link:hover {
        border-color: var(--ink);
      }
      .web-link img {
        width: 100%;
        aspect-ratio: 16 / 10;
        object-fit: cover;
        border-radius: 10px;
      }
      .web-link strong {
        display: block;
        font: 500 26px/1.1 var(--display);
      }
      .web-link span span {
        display: block;
        margin-top: 4px;
        font-size: 15px;
        color: var(--muted);
      }
      .web-link em {
        display: inline-block;
        margin-top: 10px;
        font-style: normal;
        font-size: 14px;
        border-bottom: 1px solid currentColor;
      }
      @media (max-width: 560px) {
        .web-link {
          grid-template-columns: 1fr;
          padding: 10px 10px 16px;
        }
      }
      .help-link {
        margin-top: 26px;
        display: inline-flex;
        align-items: center;
        gap: 14px;
        padding: 12px 18px 12px 12px;
        border-radius: 12px;
        border: 1px solid var(--line);
        background: var(--surface);
        text-decoration: none;
      }
      .help-link .play {
        flex: none;
        width: 44px;
        height: 44px;
        border-radius: 10px;
        background: var(--accent);
        display: grid;
        place-items: center;
      }
      .help-link .play::after {
        content: '';
        margin-inline-start: 3px;
        border-style: solid;
        border-width: 8px 0 8px 13px;
        border-color: transparent transparent transparent #fff;
      }
      [dir='rtl'] .help-link .play::after {
        transform: scaleX(-1);
      }
      .help-link strong {
        display: block;
        font-weight: 500;
      }
      .help-link span span {
        font-size: 14.5px;
        color: var(--muted);
      }
      .parts {
        margin-top: 40px;
        display: grid;
        grid-template-columns: minmax(0, 5fr) minmax(0, 7fr);
        gap: 22px;
      }
      .part {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 26px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        min-width: 0;
      }
      .step {
        width: 34px;
        height: 34px;
        border-radius: 8px;
        background: var(--accent);
        color: #fff;
        display: grid;
        place-items: center;
        font: 500 16px var(--body);
      }
      h2 {
        margin: 0;
        font: 400 34px/1.1 var(--display);
      }
      .part p {
        margin: 0;
        color: var(--muted);
      }
      .try {
        padding: 12px 14px;
        border-radius: 10px;
        background: var(--soft);
        color: var(--ink) !important;
        font-size: 15.5px;
      }
      .button {
        align-self: flex-start;
        display: inline-flex;
        align-items: center;
        gap: 10px;
        height: 50px;
        padding: 0 20px;
        border-radius: 10px;
        background: var(--accent);
        color: #fff;
        text-decoration: none;
        font-weight: 500;
      }
      .button:focus-visible,
      select:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .preview {
        margin-top: 6px;
        display: flex;
        justify-content: center;
        border-radius: 12px;
        background: linear-gradient(180deg, #efe6da, #fbf8f3);
        padding: 22px 12px;
        overflow: hidden;
      }
      /* The member app runs live inside a phone outline (390 x 844, scaled down). */
      .phone {
        width: calc(390px * 0.72 + 20px);
        height: calc(844px * 0.72 + 20px);
        padding: 10px;
        border-radius: 40px;
        background: var(--ink);
        flex: none;
      }
      .phone .screen {
        width: calc(390px * 0.72);
        height: calc(844px * 0.72);
        border-radius: 30px;
        overflow: hidden;
        background: var(--bg);
      }
      .phone iframe {
        width: 390px;
        height: 844px;
        border: 0;
        transform: scale(0.72);
        transform-origin: top left;
      }
      /* The admin screen as a live, scaled-down window (1440 x 900). */
      .window {
        display: block;
        width: 100%;
        max-width: 640px;
        border-radius: 12px;
        background: #fff;
        border: 1px solid var(--line);
        box-shadow: 0 20px 40px -24px rgba(30, 30, 28, 0.35);
        overflow: hidden;
        text-decoration: none;
      }
      .window .bar {
        height: 26px;
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 0 10px;
        background: #f1ebe2;
      }
      .window .bar i {
        width: 9px;
        height: 9px;
        border-radius: 2px;
        background: #d8ccbe;
      }
      .window .view {
        display: block;
        position: relative;
        aspect-ratio: 1440 / 900;
        overflow: hidden;
      }
      .window iframe {
        position: absolute;
        top: 0;
        left: 0;
        width: 1440px;
        height: 900px;
        border: 0;
        transform-origin: top left;
        pointer-events: none;
      }
      .facts {
        margin-top: 22px;
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 22px;
      }
      .fact {
        padding: 20px 22px;
        border-radius: 14px;
        border: 1px solid var(--line);
        background: var(--surface);
      }
      .fact strong {
        display: block;
        font: 400 26px/1.1 var(--display);
        margin-bottom: 6px;
      }
      .fact p {
        margin: 0;
        color: var(--muted);
      }
      footer {
        margin-top: 40px;
        font-size: 14px;
        color: var(--muted);
      }
      [dir='rtl'] .button {
        align-self: flex-start;
      }
      @media (max-width: 920px) {
        .parts,
        .facts {
          grid-template-columns: minmax(0, 1fr);
        }
        h1 {
          margin-top: 36px;
        }
      }
      @media (max-width: 520px) {
        /* On a phone the app opens full screen instead of inside a drawn phone. */
        .preview.app-preview {
          display: none;
        }
      }
    </style>
  </head>

        const t = TEXT[lang] || TEXT.nl;
        document.documentElement.lang = lang;
        document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
        document.querySelectorAll('[data-t]').forEach((el) => {
          el.innerHTML = t[el.dataset.t];
        });
        select.value = lang;
        select.setAttribute('aria-label', t.lang);
        // Open the app and the admin screen in the same language.
        const app = `app/?lang=${lang}`;
        const admin = `beheer/?lang=${lang}`;
        // The small preview is only a picture of the panel, so it skips the welcome card.
        const preview = `${admin}&embed=1`;
        document.getElementById('open-app').href = app;
        document.getElementById('open-admin').href = admin;
        document.getElementById('admin-window').href = admin;
        document.getElementById('open-help').href = `hulp/?lang=${lang}`;
        const appFrame = document.getElementById('app-frame');
        const adminFrame = document.getElementById('admin-frame');
        if (!appFrame.src.endsWith(app)) appFrame.src = app;
        if (!adminFrame.src.endsWith(preview)) adminFrame.src = preview;
        try {
          localStorage.setItem('demo-lang', lang);
        } catch {
          // Private windows may refuse storage; the page still works.
        }
      }

      // Scale the admin preview to the width of its window.
      const view = document.querySelector('.window .view');
      const adminFrame = document.getElementById('admin-frame');
      new ResizeObserver(() => {
        adminFrame.style.transform = `scale(${view.clientWidth / 1440})`;
      }).observe(view);

      select.addEventListener('change', () => apply(select.value));
      const fromLink = new URLSearchParams(location.search).get('lang');
      apply(TEXT[fromLink] ? fromLink : TEXT[stored()] ? stored() : 'nl');
    </script>
  </body>
</html>
