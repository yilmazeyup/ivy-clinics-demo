    <style>
      :root {
        --bg: #f6f1ea;
        --surface: #ffffff;
        --ink: #1e1e1c;
        --muted: #6e6259;
        --line: #e2d8cc;
        --ivy: #2f4a3c;
        --sage: #e1e9e3;
        --display: 'Cormorant Garamond', 'Amiri', Georgia, serif;
        --body: 'Jost', 'IBM Plex Sans Arabic', system-ui, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
      }
      body {
        background: var(--bg);
        color: var(--ink);
        font: 400 17px/1.55 var(--body);
        -webkit-font-smoothing: antialiased;
      }
      a {
        color: inherit;
      }
      .wrap {
        max-width: 1180px;
        margin: 0 auto;
        padding: 28px max(20px, env(safe-area-inset-right, 0px)) 56px max(20px, env(safe-area-inset-left, 0px));
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        flex-wrap: wrap;
      }
      .logo {
        height: 26px;
        display: block;
      }
      .head-actions {
        display: flex;
        align-items: center;
        gap: 18px;
        flex-wrap: wrap;
      }
      .back {
        font-size: 15px;
        color: var(--muted);
      }
      .lang {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 14px;
        color: var(--muted);
      }
      .lang select {
        font: 500 15px var(--body);
        color: var(--ink);
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 8px;
        height: 40px;
        padding: 0 10px;
      }
      h1 {
        margin: 56px 0 0;
        font: 300 clamp(44px, 7vw, 76px) / 1.05 var(--display);
        letter-spacing: -0.01em;
        text-wrap: balance;
      }
      h1 em {
        font-style: italic;
      }
      .lead {
        max-width: 680px;
        margin: 18px 0 0;
        font-size: 19px;
        color: var(--muted);
      }
      h2 {
        margin: 0;
        font: 400 30px/1.15 var(--display);
      }
      .player {
        margin-top: 40px;
        display: grid;
        grid-template-columns: minmax(0, 8fr) minmax(0, 4fr);
        gap: 22px;
        align-items: start;
      }
      .video {
        border-radius: 16px;
        overflow: hidden;
        background: #e9ded3;
        border: 1px solid var(--line);
        box-shadow: 0 24px 50px -30px rgba(30, 30, 28, 0.45);
      }
      video {
        display: block;
        width: 100%;
        aspect-ratio: 16 / 9;
        background: #e9ded3;
      }
      .chapters {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 22px;
      }
      .chapters ol {
        list-style: none;
        margin: 14px 0 0;
        padding: 0;
        display: grid;
      }
      .chapters button {
        width: 100%;
        display: flex;
        align-items: baseline;
        gap: 14px;
        padding: 10px 0;
        border: 0;
        border-top: 1px solid var(--line);
        background: none;
        font: 400 16px var(--body);
        color: var(--ink);
        text-align: start;
        cursor: pointer;
      }
      .chapters li:first-child button {
        border-top: 0;
      }
      .chapters button time {
        flex: none;
        width: 42px;
        color: var(--muted);
        font-size: 14px;
        font-variant-numeric: tabular-nums;
      }
      .chapters button[aria-current='true'] {
        color: var(--ivy);
        font-weight: 500;
      }
      .note {
        margin: 14px 0 0;
        padding: 12px 14px;
        border-radius: 10px;
        background: var(--sage);
        font-size: 14.5px;
      }
      .faq {
        margin-top: 48px;
      }
      .faq-grid {
        margin-top: 18px;
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
      }
      details {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 18px 20px;
      }
      summary {
        cursor: pointer;
        font-weight: 500;
        list-style: none;
        display: flex;
        justify-content: space-between;
        gap: 14px;
      }
      summary::-webkit-details-marker {
        display: none;
      }
      summary::after {
        content: '+';
        flex: none;
        color: var(--muted);
        font-weight: 400;
      }
      details[open] summary::after {
        content: '–';
      }
      details p {
        margin: 10px 0 0;
        color: var(--muted);
      }
      .button {
        margin-top: 36px;
        display: inline-flex;
        align-items: center;
        height: 50px;
        padding: 0 20px;
        border-radius: 10px;
        background: var(--ivy);
        color: #fff;
        text-decoration: none;
        font-weight: 500;
      }
      .button:focus-visible,
      select:focus-visible,
      button:focus-visible,
      summary:focus-visible {
        outline: 2px solid var(--ivy);
        outline-offset: 2px;
      }
      footer {
        margin-top: 40px;
        font-size: 14px;
        color: var(--muted);
      }
      [dir='rtl'] h1,
      [dir='rtl'] h2 {
        line-height: 1.35;
      }
      @media (max-width: 920px) {
        .player,
        .faq-grid {
          grid-template-columns: minmax(0, 1fr);
        }
        h1 {
          margin-top: 36px;
        }
      }
    </style>
  </head>

      </section>

      <footer data-t="footer"></footer>

            ['Come faccio il check-in a una lezione?', 'La lezione è nel tuo wallet. Scansiona il codice all’ingresso e il check-in è fatto.'],
            ['Cosa sa fare l’assistente Ivy?', 'Scrivi o di’ cosa vuoi, per esempio una lezione tranquilla di giovedì. L’assistente la cerca e la prenota per te. Nella demo funzionano alcune domande di esempio.'],
            ['Cosa vede il team nella gestione?', 'I numeri di oggi, le quattro cliniche con i trattamenti in corso, l’agenda per sala, le lezioni in studio, lo shop e cosa è appena successo. Il pulsante Guida ti accompagna passo dopo passo.'],
            ['È reale?', 'No, è una demo con clienti inventati e pagamenti di prova. Niente viene davvero prenotato, pagato o inviato.'],
          ],
          open: 'Apri la demo',
          footer: 'Demo · non per prenotazioni reali',
        },
      };

      const select = document.getElementById('lang');
      const video = document.getElementById('video');
      let chapters = [];
      let lang = 'nl';

      function stored() {
        try {
          return localStorage.getItem('demo-lang');
        } catch {
          return null;
        }
      }

      const clock = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;

      /** Dutch viewers get Dutch subtitles; everyone else the English ones. */
      function subtitles() {
        const want = lang === 'nl' ? 'nl' : 'en';
        for (const track of video.textTracks) track.mode = track.language === want ? 'showing' : 'hidden';
      }

      function renderChapters() {
        const t = TEXT[lang];
        const list = document.getElementById('chapters');
        list.innerHTML = '';
        for (const chapter of chapters) {
          const li = document.createElement('li');
          const button = document.createElement('button');
          button.type = 'button';
          button.dataset.start = chapter.start;
          button.innerHTML = `<time>${clock(chapter.start)}</time><span></span>`;
          button.querySelector('span').textContent = t.chapters[chapter.id];
          button.addEventListener('click', () => {
            video.currentTime = chapter.start + 0.05;
            video.play();
          });
          li.appendChild(button);
          list.appendChild(li);
        }
        markChapter();
      }

      function markChapter() {
        const buttons = [...document.querySelectorAll('#chapters button')];
        const now = video.currentTime;
        let current = 0;
        buttons.forEach((b, i) => {
          if (Number(b.dataset.start) <= now + 0.1) current = i;
        });
        buttons.forEach((b, i) => b.setAttribute('aria-current', String(i === current && now > 0)));
      }

      function renderFaq() {
        const box = document.getElementById('faq');
        box.innerHTML = '';
        for (const [q, a] of TEXT[lang].faq) {
          const item = document.createElement('details');
          const summary = document.createElement('summary');
          summary.textContent = q;
          const p = document.createElement('p');
          p.textContent = a;
          item.append(summary, p);
          box.appendChild(item);
        }
      }

      function apply(next) {
        lang = TEXT[next] ? next : 'nl';
        const t = TEXT[lang];
        document.documentElement.lang = lang;
        document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
        document.querySelectorAll('[data-t]').forEach((el) => {
          el.innerHTML = t[el.dataset.t];
        });
        select.value = lang;
        select.setAttribute('aria-label', t.lang);
        // Back to the start page and into the demo, in the same language.
        document.getElementById('home').href = `../?lang=${lang}`;
        document.getElementById('back').href = `../?lang=${lang}`;
        document.getElementById('open').href = `../?lang=${lang}`;
        renderChapters();
        renderFaq();
        subtitles();
        try {
          localStorage.setItem('demo-lang', lang);
        } catch {
          // Private windows may refuse storage; the page still works.
        }
      }

      video.addEventListener('loadedmetadata', subtitles);
      video.addEventListener('timeupdate', markChapter);
      select.addEventListener('change', () => apply(select.value));
      fetch('chapters.json')
        .then((r) => r.json())
        .then((list) => {
          chapters = list;
          renderChapters();
        })
        .catch(() => {});
      const fromLink = new URLSearchParams(location.search).get('lang');
      apply(TEXT[fromLink] ? fromLink : TEXT[stored()] ? stored() : 'nl');
    </script>
  </body>
</html>
